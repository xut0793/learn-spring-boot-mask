server.port: 8080

spring:
  application:
    name: mask-demo
  datasource:
    url: jdbc:h2:mem:mask;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  prometheus:
    metrics:
      export:
        enabled: true

masking:
  enabled: true
  channels:
    jackson: true
    logback: true
    aop: true
    mybatis: true
    strict: false
  bypass-roles:
    - ADMIN
  unmask-roles:
    - ADMIN
    - CS
  cache:
    enabled: true
    max-size: 10000
    expire-after-access-minutes: 10
  debug:
    header-role-enabled: true
    header-name: X-User-Role
  extra-map-keys:
    expressNo: EXPRESS
    express_no: EXPRESS
    trackingNo: EXPRESS
    tracking_no: EXPRESS
  reversible:
    enabled: true
    secret-key: ${MASKING_AES_KEY:demo-key-not-for-prod-32b!!}
  rules:
    phone:
      keep-prefix: 3
      keep-suffix: 4
    id-card:
      keep-prefix: 6
      keep-suffix: 4
    bank-card:
      keep-prefix: 4
      keep-suffix: 4
    email:
      keep-prefix: 1
    custom:
      keep-prefix: 1
      keep-suffix: 1
    # 地址自定义规则：有门牌号时由 AddressMaskStrategy 遮盖末尾数字；无门牌号时按保留前缀打星
    address:
      enabled: true
      keep-prefix: 3
      keep-suffix: 0
    # 业务自定义类型规则，键为 MaskStrategy.code()，无需改 starter 枚举
    extras:
      EXPRESS:
        keep-prefix: 2
        keep-suffix: 4
